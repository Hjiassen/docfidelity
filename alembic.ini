# Alembic configuration (DD-13.1 `server/storage` migrations; TASK-P0-14 round 2).
#
# NOTE: this file must stay ASCII-only. Alembic (and logging.config.fileConfig)
# read `.ini` files with the *locale* encoding, which on a zh-CN Windows host is
# GBK -- a UTF-8 Chinese comment makes `alembic upgrade` die with
# UnicodeDecodeError before it ever touches the database. Explanations live in
# `server/storage/migrations/env.py` and `server/storage/engine.py`, where Python
# source encoding is explicit.
#
# The connection string is deliberately NOT here: it comes from the
# DOCFIDELITY_DATABASE_URL environment variable, or is injected by
# server.storage.engine.migration_config(url). Putting it in this file would put
# credentials into version control.
[alembic]
script_location = server/storage/migrations
# Timestamp-prefixed filenames: directory order == chronological order, and two
# branches generating a revision on the same day cannot collide.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
# `script_location` above is RELATIVE and is resolved against the process cwd,
# so `alembic upgrade head` MUST be started from the repository root (and with
# the kernel importable, i.e. `src` on PYTHONPATH in a dev checkout). Only the
# sys.path half is handled for you by env.py -- see its module docstring.
#
# Programmatic callers do NOT have that precondition: server.storage.engine
# .migration_config(url) overrides `script_location` with an ABSOLUTE path, so
# the service and the tests run migrations from any working directory.
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
